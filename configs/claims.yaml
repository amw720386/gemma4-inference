# Register of the Backboard article's claims (https://backboard.io/blog/gemma-4-12b-vllm-sglang-inference, 2026-11-09)
# and how this project can (or cannot) check each one. `g4bench claims` renders docs/CLAIMS.md and computes the
# evidence status of measurable claims ONLY from measured results (results/runs -> g4bench analyze). Never edit a
# status by hand.
#
# kind:
#   measurable           - checkable by running the open engines on the article's workload and hardware
#   verified-source      - checked against primary sources (no measurement needed); evidence cited
#   verified-analysis    - checked by analysis of the article's own numbers; evidence cited
#   untestable           - cannot be checked by an independent party (proprietary / unpublished)
claims:
  - id: C01
    text: "vLLM 0.33.0 (MTP 4 tokens, async scheduling, gpu-mem 0.90, prefix caching off) output throughput on 1x RTX PRO 6000, Gemma 4 12B BF16, at ISL {1K,8K} x conc {1,4,16,64}, OSL 1K"
    kind: measurable
    engine: vllm
    metric: output_throughput
    keys: ["1024x1", "1024x4", "1024x16", "1024x64", "8192x1", "8192x4", "8192x16", "8192x64"]
    plan: "E2: all 8 workloads at seed 0 (n=1; 8192x4 n=2), +0.9 to +3.1 % vs the article. The same recipe is side A of the same-GPU pairs (results/pairs/): 6-10 runs per workload, +0.5 to +1.6 % vs the article; the status uses that larger set"
  - id: C02
    text: "SGLang 0.5.23 (NEXTN 5 steps / 6 draft tokens, mem 0.85, radix cache off) output throughput at the same 8 workloads"
    kind: measurable
    engine: sglang
    metric: output_throughput
    keys: ["1024x1", "1024x4", "1024x16", "1024x64", "8192x1", "8192x4", "8192x16", "8192x64"]
    plan: "E3: all 8 workloads at seed 0 (n=1), +6.8 to +16.5 % vs the article; SGLang auto-caps at 48 running requests, so its c64 points queue"
  - id: C03
    text: "Open-engine latency figures: p99 TPOT, p99 E2EL and p90 TTFT for vLLM and SGLang at the 8 workloads"
    kind: measurable
    engine: [vllm, sglang]
    metric: [p99_tpot_ms, p99_e2el_ms, p90_ttft_ms]
    keys: ["1024x1", "1024x4", "1024x16", "1024x64", "8192x1", "8192x4", "8192x16", "8192x64"]
    plan: "measured by the same runs as C01/C02"
  - id: C04
    text: "vLLM outperforms SGLang by 1.4-2.1x in throughput/TPOT at every workload (implied by the article's ratio tables; Backboard cancels out)"
    kind: measurable
    engine: [vllm, sglang]
    metric: engine_ratio
    keys: ["1024x1", "1024x4", "1024x16", "1024x64", "8192x1", "8192x4", "8192x16", "8192x64"]
    plan: "seed-matched comparison of the E2/E3 runs (g4bench analyze -> engine_comparison.csv), n=1 per workload"
  - id: C05
    text: "Backboard's engine achieves the reported throughput/latency and wins 208/208 metric comparisons"
    kind: untestable
    reason: "Backboard's engine, kernels and raw data are proprietary/unpublished; only its reported numbers exist. We can at most bound them against open-engine results on the same workload."
  - id: C06
    text: "Backboard's draft head shortlists candidates in 4-bit and rescores in BF16 without changing the BF16 target output"
    kind: untestable
    reason: "Implementation unavailable. The open analogue built here is an FP8 draft-head scan with exact BF16 rescoring of the top 32 candidates (image patch mtp_draft_head_q, D-054, admissibility b), part of the final config."
  - id: C07
    text: "The competitor flags stated in the article match the engines' published recipes (and exist at the pinned versions)"
    kind: verified-source
    evidence: "Engine flags match vllm-project/recipes gemma-4-12B-it.yaml (fa1173a1) and the SGLang Gemma4 cookbook; every flag exists at the pinned tags (configs/engine_flags/, D-023). Unstated defaults (max-model-len, scheduler limits, attention backend) are recorded per run from server logs (D-025)."
  - id: C08
    text: "Inferred from the article's own numbers: output lengths varied per request (not fixed at 1024 tokens)"
    kind: verified-analysis
    evidence: "16/24 published (p99 E2EL, p99 TPOT) pairs are impossible with fixed 1024-token outputs (src/g4bench/inference_checks.py), consistent with InferenceX RANDOM_RANGE_RATIO=0.8 (D-004)."
  - id: C09
    text: "Hardware: one NVIDIA RTX PRO 6000 Blackwell 96 GB per server, default clocks and power"
    kind: measurable
    metric: hardware
    plan: "Every run records nvidia-smi name, power limits, clocks, driver; exact_hardware flag. E1 (2026-11-11): Modal's GPU is the RTX PRO 6000 Blackwell Server Edition, 600 W power limit, driver 610.57.04; the article does not state its edition, so equality cannot be checked."
  - id: C10
    text: "Results are from one run per point (three seeds averaged at 8K/c4)"
    kind: verified-source
    evidence: "Stated in the article's limitations; our design labels n<3 results descriptive and reports same-GPU paired ratios with t-CIs over pairs (D-005, D-061)."
  - id: C11
    text: "The exact client run: InferenceX bench_serving commit, random range ratio and chat-template handling used by Backboard"
    kind: untestable
    reason: "Not stated in the article. We pin InferenceX 0b991451 and range ratio 0.8 (the InferenceX default), fingerprint the resulting request streams for seeds 0-2, and report the choice as an assumption."
