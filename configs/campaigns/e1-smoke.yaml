# E1: smoke first (NEXT.md §B steps 1-4). Executed by `python modal_bridge/campaign.py e1-smoke --execute`.
# Every step re-checks /health and /budget; the campaign stops at the first failed gate.
name: e1-smoke
require:            # /health and /budget must show exactly the approved server-side limits
  cap_usd: 10.0
  per_job_cap_usd_max: 2.0
  max_active: 1
steps:
  - {id: selftest, kind: selftest, expect: {rc: 0}}
  - {id: prefetch, kind: prefetch, expect: {speedbench_coding_digest: "6f1845452f1cfbc1930ea779ba6c3d5b437a9d5853eca199dd9b7619b20a0c18"}}
  - {id: smoke-vllm, kind: job, spec: {engine: vllm-0.33.0-mtp4, matrix: smoke, max_usd: 2.0, notes: "E1 smoke"},
     expect: {all_points_valid: true}}
  - {id: smoke-sglang, kind: job, spec: {engine: sglang-0.5.23-nextn, matrix: smoke, max_usd: 2.0, notes: "E1 smoke"},
     expect: {all_points_valid: true}}
