[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g4bench"
version = "0.1.0"
description = "Open-source vLLM recipe and patches that serve Gemma 4 12B faster than Backboard's published numbers, with a same-GPU A/B benchmark harness."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pyyaml>=6", "numpy>=1.26", "requests>=2.31"]

[project.optional-dependencies]
client = ["aiohttp>=3.9", "transformers>=5.10", "tqdm>=4.66", "huggingface_hub>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8", "pyarrow>=15", "modal==1.6.3", "aiohttp>=3.9", "transformers>=5.10", "tqdm>=4.66", "huggingface_hub>=0.30", "jinja2>=3.1"]
modal = ["modal==1.6.3"]
speedbench = ["pyarrow>=15", "requests>=2.31"]

[project.scripts]
g4bench = "g4bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["network: needs outbound HTTPS (HF Hub)", "slow: > 10 s"]
